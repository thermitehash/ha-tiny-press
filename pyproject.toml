[project]
name = "ha-tiny-press"
version = "0.6.0"
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "SIM", "RUF", "ASYNC", "PL", "TID", "D"]
ignore = ["TID252", "RUF001", "RUF002", "RUF003", "E501", "D203", "D213", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC240", "D", "PLC0415", "PLR0917", "S101"]
"script/**" = ["D"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
